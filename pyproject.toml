[project]
name = "pip-release-utilities"
version = "0"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["ruff", "ty"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF", "C4", "PIE", "RET", "PTH", "N", "PLW"]
