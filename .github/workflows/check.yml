name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} python -m unittest discover -s tests
